# ============================================================================
# Proje 7 - Yedekleme Otomasyon Merkezi Ayar Dosyasi
# Bu dosya tum scriptler tarafindan okunur
# ============================================================================

# Veritabani Ayarlari
DB_NAME="hastane_db"
DB_USER="$(whoami)"
PG_BIN="/opt/homebrew/opt/postgresql@14/bin"

# Dizin Ayarlari (script tarafindan otomatik ayarlanir)
# PROJECT_DIR, BACKUP_DIR, LOG_DIR, REPORT_DIR scriptlerde tanimlanir

# Yedekleme Ayarlari
BACKUP_FORMAT="custom"          # custom, plain, tar
BACKUP_COMPRESSION=6            # 0-9 (0=yok, 9=max)
BACKUP_PREFIX="hastane_db"

# Saklama Politikasi (Retention)
RETENTION_DAILY_DAYS=7          # Gunluk yedekler kac gun tutulsun
RETENTION_WEEKLY_WEEKS=4        # Haftalik yedekler kac hafta tutulsun
RETENTION_MONTHLY_MONTHS=6      # Aylik yedekler kac ay tutulsun
MAX_BACKUP_COUNT=50             # Maksimum yedek dosya sayisi

# Uyari Ayarlari
ALERT_ENABLED=true
ALERT_LOG_FILE="alert_history.log"
ALERT_ON_FAILURE=true
ALERT_ON_SIZE_ANOMALY=true
ALERT_SIZE_THRESHOLD_PERCENT=50 # Boyut %50 den fazla degisirse uyar

# Dogrulama Ayarlari
VERIFY_AFTER_BACKUP=true        # Yedek sonrasi dogrula
VERIFY_RESTORE_TEST=true        # Test DB ye restore dene
VERIFY_TEST_DB="hastane_db_verify_test"

# Raporlama Ayarlari
REPORT_FORMAT="html"            # html, txt, json
REPORT_INCLUDE_DETAILS=true
REPORT_INCLUDE_STATS=true

# Zamanlayici Ayarlari
SCHEDULE_DAILY_TIME="02:00"
SCHEDULE_WEEKLY_DAY="Sunday"
SCHEDULE_WEEKLY_TIME="03:00"
